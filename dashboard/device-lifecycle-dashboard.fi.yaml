                  {% set hours = states(entity) | float(0) %}
                  {% set hours_text =
                    ('%.1f' | format(hours))
                    | replace('.', ',') ~ ' h' %}
                {% else %}
                  {% set hours_text = '—' %}
                {% endif %}

                {% if state_attr(entity, 'lahde_saatavilla') == false %}
                  {% set status = '🔴 Lähde puuttuu' %}
                {% elif state_attr(entity, 'aktiivinen') == true %}
                  {% set status = '🟢 Käynnissä' %}
                {% else %}
                  {% set status = '⚪ Seurannassa' %}
                {% endif %}

                {% set row =
                  '| ' ~ display_name
                  ~ ' | ' ~ hours_text
                  ~ ' | ' ~ status
                  ~ ' |'
                %}

                {% set table.lines = table.lines + [row] %}
              {% endfor %}


              {{ table.lines | join('\n') }}


              {% endif %}
          - type: markdown
            content: >
              ## Laitelinkit


              {% set entities = integration_entities('device_lifecycle') | list
              %}

              {% set ns = namespace(items=[]) %}


              {% for entity in entities %}
                {% if state_attr(entity, 'primary_state') is not none
                      and states(entity) != 'none' %}

                  {% set name = device_name(entity) or
                    state_attr(entity, 'friendly_name') or entity %}

                  {% set ns.items = ns.items + [{
                    'name': name,
                    'entity': entity
                  }] %}
                {% endif %}
              {% endfor %}


              {% if ns.items | count == 0 %}


              Laitelinkkejä ei ole määritetty.


              {% else %}


              {% set table = namespace(lines=[
                '| Asset | Päälaite | Liittyvät |',
                '|---|---|---|'
              ]) %}


              {% for item in ns.items | sort(attribute='name') %}
                {% set entity = item.entity %}
                {% set dev = device_id(entity) %}

                {% if dev %}
                  {% set asset_name =
                    '**[' ~ item.name ~ '](/config/devices/device/'
                    ~ dev ~ ')**' %}
                {% else %}
                  {% set asset_name = '**' ~ item.name ~ '**' %}
                {% endif %}

                {# Primary #}
                {% set primary_state =
                  state_attr(entity, 'primary_state') %}

                {% if primary_state == 'present' %}
                  {% set primary_text =
                    state_attr(entity, 'primary_device_name')
                    or 'Päälaite' %}
                {% elif primary_state == 'missing' %}
                  {% set primary_text = '🔴 Puuttuu' %}
                {% else %}
                  {% set primary_text = '—' %}
                {% endif %}

                {# Related #}
                {% set related =
                  state_attr(entity, 'related_devices') or [] %}
                {% set rel = namespace(names=[]) %}

                {% for relation in related %}
                  {% if relation.state == 'missing' %}
                    {% set relation_name = '🔴 Puuttuu' %}
                  {% else %}
                    {% set relation_name =
                      relation.name or relation.device_id %}
                  {% endif %}

                  {% set rel.names =
                    rel.names + [relation_name] %}
                {% endfor %}

                {% if rel.names | count > 0 %}
                  {% set related_text = rel.names | join(', ') %}
                {% else %}
                  {% set related_text = '—' %}
                {% endif %}

                {% set row =
                  '| ' ~ asset_name
                  ~ ' | ' ~ primary_text
                  ~ ' | ' ~ related_text
                  ~ ' |'
                %}

                {% set table.lines = table.lines + [row] %}
              {% endfor %}


              {{ table.lines | join('\n') }}


              {% endif %}
          - type: markdown
            content: >
              ## Huomiot


              {% set entities = integration_entities('device_lifecycle') | list
              %}

              {% set ns = namespace(
                runtime=0,
                relationships=0,
                areas=0
              ) %}


              {% for entity in entities %}
                {% if state_attr(entity, 'lahde_entiteetti') is not none
                      and state_attr(entity, 'lahde_saatavilla') == false %}
                  {% set ns.runtime = ns.runtime + 1 %}
                {% endif %}

                {% if state_attr(entity, 'primary_state') is not none
                      and states(entity) == 'missing' %}
                  {% set ns.relationships = ns.relationships + 1 %}
                {% endif %}

                {% if state_attr(entity, 'asset_area_state') == 'missing' %}
                  {% set ns.areas = ns.areas + 1 %}
                {% endif %}
              {% endfor %}


              {% if ns.runtime == 0
                    and ns.relationships == 0
                    and ns.areas == 0 %}

              ✅ Device Lifecycle -tiedoissa ei havaittu ongelmia.


              {% else %}


              {% if ns.runtime > 0 %}

              🔴 **{{ ns.runtime }} Runtime-lähdettä ei saatavilla**

              {% endif %}


              {% if ns.relationships > 0 %}

              🔴 **{{ ns.relationships }} assetilla puuttuva laitelinkki**

              {% endif %}


              {% if ns.areas > 0 %}

              🟠 **{{ ns.areas }} assetilla puuttuva Area-viite**

              {% endif %}


              {% endif %}
      - type: grid
        column_span: 1
        cards:
          - type: markdown
            content: >
              ## Korvaavuusdiagnostiikka


              {% set entities = integration_entities('device_lifecycle') | list
              %}

              {# Replacement is uniquely identified in 0.7.0 by both
                 predecessor/successor list attributes. #}

              {% set ns = namespace(
                available=0,
                edge_keys=[],
                edges=[]
              ) %}


              {% for entity in entities %}
                {% if state_attr(entity, 'takuu_tila') is not none %}
                  {% set asset_id = state_attr(entity, 'asset_id') %}
                  {% set asset_device_id = device_id(entity) %}

                  {% for sibling in entities %}
                    {% if asset_device_id
                          and device_id(sibling) == asset_device_id %}
                      {% set predecessors = state_attr(
                        sibling, 'predecessor_asset_ids') %}
                      {% set successors = state_attr(
                        sibling, 'successor_asset_ids') %}

                      {% if predecessors is not none
                            and successors is not none %}
                        {% set ns.available = ns.available + 1 %}

                        {% set predecessors = predecessors or [] %}
                        {% set successors = successors or [] %}

                        {% for predecessor in predecessors %}
                          {% set edge_key =
                            predecessor ~ '>' ~ asset_id %}
                          {% if edge_key not in ns.edge_keys %}
                            {% set ns.edge_keys =
                              ns.edge_keys + [edge_key] %}
                            {% set ns.edges = ns.edges + [{
                              'from': predecessor,
                              'to': asset_id
                            }] %}
                          {% endif %}
                        {% endfor %}

                        {% for successor in successors %}
                          {% set edge_key =
                            asset_id ~ '>' ~ successor %}
                          {% if edge_key not in ns.edge_keys %}
                            {% set ns.edge_keys =
                              ns.edge_keys + [edge_key] %}
                            {% set ns.edges = ns.edges + [{
                              'from': asset_id,
                              'to': successor
                            }] %}
                          {% endif %}
                        {% endfor %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}
                {% endif %}
              {% endfor %}


              **Käytettävissä olevat Korvaavuus-entiteetit:** {{ ns.available }}


              {% if ns.available == 0 %}

              Korvaavuus-entiteetit, joilla ei ole aktiivisia suhteita, ovat
              oletuksena pois käytöstä. Entiteettien puuttuminen ei tarkoita, ettei
              korvaussuhteita olisi.

              {% elif ns.edges | count == 0 %}

              Käytettävissä olevat entiteetit eivät ilmoita aktiivisia
              korvaussuhteita.

              {% else %}

              {% set table = namespace(lines=[
                '| Edeltäjä | Seuraaja |',
                '|---|---|'
              ]) %}


              {% for edge in ns.edges %}
                {% set predecessor = namespace(
                  name='',
                  device=''
                ) %}
                {% set successor = namespace(
                  name='',
                  device=''
                ) %}

                {% for candidate in entities %}
                  {% if state_attr(candidate, 'takuu_tila') is not none %}
                    {% set candidate_id =
                      state_attr(candidate, 'asset_id') %}

                    {% if candidate_id == edge.from %}
                      {% set predecessor.name =
                        device_name(candidate)
                        or (state_attr(candidate, 'friendly_name')
                          or candidate)
                          | replace(' Elinkaari', '') %}
                      {% set predecessor.device = device_id(candidate) %}
                    {% endif %}

                    {% if candidate_id == edge.to %}
                      {% set successor.name =
                        device_name(candidate)
                        or (state_attr(candidate, 'friendly_name')
                          or candidate)
                          | replace(' Elinkaari', '') %}
                      {% set successor.device = device_id(candidate) %}
                    {% endif %}
                  {% endif %}
                {% endfor %}

                {% if predecessor.name %}
                  {% if predecessor.device %}
                    {% set predecessor_text =
                      '[' ~ predecessor.name
                      ~ '](/config/devices/device/'
                      ~ predecessor.device ~ ')<br>' ~ edge.from %}
                  {% else %}
                    {% set predecessor_text =
                      predecessor.name ~ '<br>' ~ edge.from %}
                  {% endif %}
                {% else %}
                  {% set predecessor_text = edge.from %}
                {% endif %}

                {% if successor.name %}
                  {% if successor.device %}
                    {% set successor_text =
                      '[' ~ successor.name
                      ~ '](/config/devices/device/'
                      ~ successor.device ~ ')<br>' ~ edge.to %}
                  {% else %}
                    {% set successor_text =
                      successor.name ~ '<br>' ~ edge.to %}
                  {% endif %}
                {% else %}
                  {% set successor_text = edge.to %}
                {% endif %}

                {% set row =
                  '| ' ~ predecessor_text
                  ~ ' | ' ~ successor_text
                  ~ ' |'
                %}

                {% set table.lines = table.lines + [row] %}
              {% endfor %}


              {{ table.lines | join('\n') }}


              Vain käyttöön otetut Korvaavuus-entiteetit ovat mukana.
              Diagnostiikka säilyttää sekä nimet että Asset ID:t, kun nimet
              voidaan ratkaista.

              {% endif %}
    cards: []
