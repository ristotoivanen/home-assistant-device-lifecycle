name: Quality gates

on:
  push:
  pull_request:
  # Daily run on the default branch so a red main cannot go unnoticed
  # between pushes (0.7.3 WP-06). A scheduled run has no before/base
  # commit, so the diff check below checks the full tree.
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: pytest, coverage, Ruff, dashboard, diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history is required so the diff-check step below can
          # compare against an arbitrary base/before commit, not just the
          # single commit a shallow checkout would provide.
          fetch-depth: 0

      - name: Check whitespace/diff errors in the actual change range
        # A bare `git diff --check` on a fresh checkout compares the
        # working tree to itself and always passes trivially. Instead,
        # check only the lines this push/PR actually introduces.
        run: |
          set -eu

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          empty_tree="$(git hash-object -t tree /dev/null)"

          # Fall back to a full-tree check against the empty tree when
          # there is no usable base commit: the initial push to a new
          # branch (before == all-zero SHA) or a base/before commit that
          # is not reachable in this checkout (e.g. force-push history
          # rewrite pruning it away).
          if [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit for $base; checking the full tree at $head instead."
            base="$empty_tree"
          fi

          echo "Checking diff range: $base..$head"
          git diff --check "$base" "$head"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # pytest-homeassistant-custom-component 0.13.366 pulls in
          # homeassistant, which requires Python >=3.14.2.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test/quality-gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Report supported Home Assistant baseline
        run: |
          installed="$(python -c 'from homeassistant.const import __version__; print(__version__)')"
          echo "Supported Home Assistant baseline: $installed"
          echo "Supported Home Assistant baseline: $installed" >> "$GITHUB_STEP_SUMMARY"

      - name: Ruff baseline regression gate
        # Not a bare `ruff check .`: historical debt is grandfathered by
        # exact per-(file, rule) count in ruff_baseline.json, so growing an
        # already-tolerated finding still fails even though the rule/file
        # is not clean repo-wide. See .github/scripts/check_ruff_baseline.py.
        run: python .github/scripts/check_ruff_baseline.py

      - name: Dashboard check
        run: python dashboard/build.py --check

      - name: pytest with branch coverage
        run: |
          pytest -q \
            --cov=custom_components.device_lifecycle \
            --cov-report=term-missing

  minimum-ha:
    # hacs.json promises support down to its declared minimum Home Assistant.
    # The Device Registry iteration model differs between 2026.8 and 2026.9,
    # and the supported-baseline job above only runs 2026.9.x, so run the
    # full suite on exactly the declared minimum release as well.
    name: pytest on minimum supported Home Assistant
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test_minimum.txt

      - name: Install minimum supported test stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test_minimum.txt

      - name: Verify Home Assistant equals the declared minimum
        # Fail unless this job tests exactly the Home Assistant version
        # hacs.json declares as the minimum, so the two cannot drift apart.
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          from homeassistant.const import __version__ as installed

          with open("hacs.json", encoding="utf-8") as file:
              declared = json.load(file)["homeassistant"]
          line = (
              f"Minimum supported Home Assistant: declared {declared}, "
              f"tested {installed}"
          )
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              print(line, file=summary)

          if installed != declared:
              print(
                  f"::error::Expected exactly the declared minimum Home "
                  f"Assistant {declared}; got {installed}"
              )
              sys.exit(1)
          PY

      - name: pytest
        run: pytest -q
