name: Latest Home Assistant compatibility

# Advisory forward-compatibility signal (0.7.3 WP-05).
#
# The supported, merge-blocking baseline is the exact test pin in
# requirements_test.txt, exercised by quality.yml on every push and pull
# request. This workflow answers a different question - has upstream Home
# Assistant moved? - so it only runs on a schedule and on demand, is never a
# required check, and still fails red (no continue-on-error) when the newest
# stable Home Assistant breaks the suite. Moving the supported pin to that
# version stays an explicit, reviewed change to requirements_test.txt.

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-stable:
    name: pytest on latest stable Home Assistant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history is required: the suite compares the entity
          # translations against the v0.7.3 release commit with `git show`,
          # which a shallow checkout does not contain.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Resolve test packages for supported and latest stable HA
        id: resolve
        # pytest-homeassistant-custom-component also publishes releases
        # pinned to Home Assistant betas, so the bare latest release could
        # silently test a beta. Resolve the newest release pinned to a
        # final X.Y.Z Home Assistant instead.
        run: |
          set -eu
          latest="$(python .github/scripts/resolve_ha_test_pin.py)"
          read -r latest_package latest_ha <<< "$latest"
          supported_package="$(sed -n 's/^pytest-homeassistant-custom-component==//p' requirements_test.txt)"
          supported="$(python .github/scripts/resolve_ha_test_pin.py "$supported_package")"
          read -r _ supported_ha <<< "$supported"
          {
            echo "latest_package=$latest_package"
            echo "latest_ha=$latest_ha"
            echo "supported_package=$supported_package"
            echo "supported_ha=$supported_ha"
          } >> "$GITHUB_OUTPUT"

      - name: Install latest stable test stack
        run: |
          python -m pip install --upgrade pip
          pip install "pytest-homeassistant-custom-component==${{ steps.resolve.outputs.latest_package }}"

      - name: Verify and report resolved Home Assistant
        env:
          LATEST_PACKAGE: ${{ steps.resolve.outputs.latest_package }}
          LATEST_HA: ${{ steps.resolve.outputs.latest_ha }}
          SUPPORTED_PACKAGE: ${{ steps.resolve.outputs.supported_package }}
          SUPPORTED_HA: ${{ steps.resolve.outputs.supported_ha }}
        run: |
          set -eu
          installed="$(python -c 'from homeassistant.const import __version__; print(__version__)')"
          {
            echo "### Home Assistant compatibility"
            echo
            echo "| | Test package | Home Assistant |"
            echo "| --- | --- | --- |"
            echo "| Supported baseline (blocking) | $SUPPORTED_PACKAGE | $SUPPORTED_HA |"
            echo "| Latest stable (this run) | $LATEST_PACKAGE | $installed |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Installed Home Assistant: $installed"
          if [ "$installed" != "$LATEST_HA" ]; then
            echo "::error::Resolved Home Assistant $LATEST_HA but installed $installed"
            exit 1
          fi
          if [ "$LATEST_HA" != "$SUPPORTED_HA" ]; then
            echo "::notice::Latest stable Home Assistant $LATEST_HA is ahead of the supported baseline $SUPPORTED_HA"
          fi

      - name: pytest
        run: pytest -q
